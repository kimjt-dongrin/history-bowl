<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>HISTORY CONQUEST</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0a0a1a;--bg2:#12122a;--bg3:#1a1a3a;--text:#e0e0ff;--gold:#ffd700;
--accent:#7c4dff;--accent2:#ff4081;--green:#00e676;--red:#ff1744;
--blue:#448aff;--card-bg:#1e1e3e;--card-border:#2a2a5a;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes glow{0%,100%{box-shadow:0 0 5px var(--accent)}50%{box-shadow:0 0 20px var(--accent),0 0 40px var(--accent)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes slideIn{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes cardSpawn{from{transform:scale(0) rotate(-180deg);opacity:0}to{transform:scale(1) rotate(0deg);opacity:1}}
@keyframes dmgFlash{0%{background:rgba(255,23,68,0.3)}100%{background:transparent}}
@keyframes healFlash{0%{background:rgba(0,230,118,0.3)}100%{background:transparent}}
@keyframes starBurst{0%{transform:scale(0);opacity:1}100%{transform:scale(2);opacity:0}}
@keyframes progressFill{from{width:0}to{width:var(--fill)}}

body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;
min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}

.screen{display:none;width:100%;min-height:100vh;padding:10px;max-width:800px;margin:0 auto}
.screen.active{display:block;animation:slideIn 0.3s ease}

/* HUD */
.hud{position:fixed;top:0;left:0;right:0;z-index:100;
background:linear-gradient(180deg,rgba(10,10,26,0.98),rgba(10,10,26,0.85));
padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
border-bottom:2px solid var(--accent);backdrop-filter:blur(10px)}
.hud-item{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600}
.hud-item .icon{font-size:16px}
.hud-item .val{color:var(--gold)}
.xp-bar{flex:1;min-width:80px;height:14px;background:var(--bg3);border-radius:7px;overflow:hidden;position:relative}
.xp-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
border-radius:7px;transition:width 0.5s ease}
.xp-bar-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
font-size:10px;font-weight:700;text-shadow:0 0 3px #000}

/* Main Menu */
.menu-title{text-align:center;padding:60px 0 10px;font-size:clamp(28px,6vw,48px);font-weight:900;
background:linear-gradient(135deg,var(--gold),var(--accent2),var(--accent));
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
text-shadow:none;letter-spacing:2px}
.menu-subtitle{text-align:center;font-size:14px;color:#888;margin-bottom:20px}
.era-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:10px 0}
.era-card{background:var(--card-bg);border:2px solid var(--card-border);border-radius:12px;
padding:16px 12px;text-align:center;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden}
.era-card:hover,.era-card:active{transform:translateY(-3px);border-color:var(--accent);
box-shadow:0 4px 20px rgba(124,77,255,0.3)}
.era-card .era-emoji{font-size:36px;display:block;margin-bottom:6px}
.era-card .era-name{font-size:14px;font-weight:700;margin-bottom:2px}
.era-card .era-desc{font-size:11px;color:#888;margin-bottom:8px}
.era-card .era-progress{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.era-card .era-progress-fill{height:100%;border-radius:3px;transition:width 0.5s}
.era-card .era-stats{font-size:11px;color:#aaa;margin-top:6px}
.era-card.locked{opacity:0.4;pointer-events:none}
.era-card .era-badge{position:absolute;top:6px;right:6px;font-size:10px;padding:2px 6px;
border-radius:8px;font-weight:700}

.menu-buttons{display:flex;gap:10px;justify-content:center;margin:20px 0;flex-wrap:wrap}

/* Buttons */
.btn{padding:10px 20px;border:2px solid var(--accent);border-radius:8px;background:transparent;
color:var(--text);font-size:14px;font-weight:700;cursor:pointer;transition:all 0.2s;
text-transform:uppercase;letter-spacing:1px}
.btn:hover,.btn:active{background:var(--accent);color:#fff;transform:scale(1.02)}
.btn-gold{border-color:var(--gold);color:var(--gold)}
.btn-gold:hover,.btn-gold:active{background:var(--gold);color:#000}
.btn-red{border-color:var(--red);color:var(--red)}
.btn-red:hover,.btn-red:active{background:var(--red);color:#fff}
.btn-green{border-color:var(--green);color:var(--green)}
.btn-green:hover,.btn-green:active{background:var(--green);color:#000}
.btn-small{padding:6px 12px;font-size:12px}
.btn-back{position:fixed;bottom:16px;left:16px;z-index:90;padding:8px 16px;
background:rgba(10,10,26,0.9);backdrop-filter:blur(5px)}

/* Base Screen */
.base-header{text-align:center;padding:55px 0 10px}
.base-header .era-icon{font-size:48px}
.base-header h2{font-size:22px;margin:4px 0}
.base-header .desc{font-size:12px;color:#888}

.generator-area{position:relative;min-height:220px;background:var(--bg2);
border:2px solid var(--card-border);border-radius:16px;margin:12px 0;overflow:hidden;
background-image:radial-gradient(circle at 50% 50%,rgba(124,77,255,0.05),transparent 70%)}
.generator-label{text-align:center;padding:8px;font-size:12px;color:#666;text-transform:uppercase;letter-spacing:2px}
.floating-card{position:absolute;width:90px;height:110px;background:var(--card-bg);
border:2px solid var(--accent);border-radius:10px;cursor:pointer;
display:flex;flex-direction:column;align-items:center;justify-content:center;
padding:6px;text-align:center;animation:cardSpawn 0.4s ease,float 3s ease-in-out infinite;
transition:all 0.15s;z-index:2}
.floating-card:hover{transform:scale(1.1);border-color:var(--gold);
box-shadow:0 0 15px rgba(255,215,0,0.4)}
.floating-card .card-emoji{font-size:24px}
.floating-card .card-label{font-size:9px;font-weight:600;margin-top:4px;
overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.floating-card .card-rarity{font-size:8px;font-weight:700;margin-top:2px;text-transform:uppercase}
.floating-card.common{border-color:#888}.floating-card.common .card-rarity{color:#888}
.floating-card.rare{border-color:#448aff}.floating-card.rare .card-rarity{color:#448aff}
.floating-card.epic{border-color:#aa00ff;box-shadow:0 0 10px rgba(170,0,255,0.3)}.floating-card.epic .card-rarity{color:#aa00ff}
.floating-card.legendary{border-color:var(--gold);box-shadow:0 0 15px rgba(255,215,0,0.4);animation:cardSpawn 0.4s ease,float 2s ease-in-out infinite,glow 2s ease-in-out infinite}.floating-card.legendary .card-rarity{color:var(--gold)}

.card-shelf{margin:12px 0}
.card-shelf h3{font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.shelf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.shelf-item{background:var(--card-bg);border:2px solid var(--card-border);border-radius:8px;
padding:8px;text-align:center;cursor:pointer;transition:all 0.2s;position:relative}
.shelf-item:hover{border-color:var(--accent);transform:translateY(-2px)}
.shelf-item .item-emoji{font-size:20px}
.shelf-item .item-name{font-size:10px;font-weight:600;margin-top:2px;
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shelf-item .item-progress{height:4px;background:var(--bg);border-radius:2px;margin-top:4px;overflow:hidden}
.shelf-item .item-progress-fill{height:100%;border-radius:2px}
.shelf-item .item-count{font-size:9px;color:#888;margin-top:2px}
.shelf-item.complete{border-color:var(--green);box-shadow:0 0 8px rgba(0,230,118,0.2)}

.attack-btn-wrap{text-align:center;margin:16px 0}

/* Battle Screen */
.battle-area{padding-top:55px}
.hp-bars{display:flex;justify-content:space-between;gap:12px;margin-bottom:16px}
.hp-bar-wrap{flex:1}
.hp-bar-label{font-size:12px;font-weight:700;margin-bottom:4px;display:flex;justify-content:space-between}
.hp-bar{height:20px;background:var(--bg3);border-radius:10px;overflow:hidden;border:1px solid var(--card-border)}
.hp-bar-fill{height:100%;border-radius:10px;transition:width 0.5s ease}
.hp-player .hp-bar-fill{background:linear-gradient(90deg,var(--green),#69f0ae)}
.hp-enemy .hp-bar-fill{background:linear-gradient(90deg,var(--red),#ff6e40)}

.battle-question{background:var(--card-bg);border:2px solid var(--card-border);border-radius:12px;
padding:16px;margin:12px 0;animation:slideIn 0.3s ease}
.battle-hints{margin-bottom:12px}
.battle-hint{padding:6px 10px;margin:4px 0;background:var(--bg2);border-radius:6px;
font-size:13px;border-left:3px solid var(--accent)}
.battle-hint.known{border-left-color:var(--green)}
.battle-hint.unknown{border-left-color:var(--card-border);color:#555;font-style:italic}
.battle-choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.battle-choice{padding:12px;background:var(--bg2);border:2px solid var(--card-border);
border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;
text-align:center;transition:all 0.15s}
.battle-choice:hover{border-color:var(--accent);background:var(--bg3)}
.battle-choice.correct{border-color:var(--green);background:rgba(0,230,118,0.15);color:var(--green)}
.battle-choice.wrong{border-color:var(--red);background:rgba(255,23,68,0.15);color:var(--red);animation:shake 0.3s}
.battle-choice.disabled{pointer-events:none;opacity:0.5}
.battle-result{text-align:center;padding:12px;font-size:16px;font-weight:700;border-radius:8px;margin:8px 0}

/* Card Detail Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;
align-items:center;justify-content:center;padding:16px}
.modal-overlay.active{display:flex}
.modal{background:var(--bg2);border:2px solid var(--accent);border-radius:16px;
padding:20px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;
animation:slideIn 0.3s ease}
.modal-close{float:right;background:none;border:none;color:var(--text);font-size:24px;
cursor:pointer;padding:0 4px;line-height:1}
.modal h2{font-size:20px;margin:8px 0;display:flex;align-items:center;gap:8px}
.modal .modal-era{font-size:12px;color:#888;margin-bottom:12px}
.fact-list{list-style:none}
.fact-list li{padding:8px 10px;margin:4px 0;background:var(--bg3);border-radius:6px;
font-size:13px;position:relative;padding-left:30px}
.fact-list li::before{content:attr(data-num);position:absolute;left:8px;top:8px;
width:18px;height:18px;background:var(--accent);border-radius:50%;
display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.fact-list li.locked{color:#444;font-style:italic}
.fact-list li.locked::before{background:var(--card-border)}
.fun-fact{margin-top:12px;padding:10px;background:rgba(255,215,0,0.1);border:1px solid var(--gold);
border-radius:8px;font-size:12px;color:var(--gold)}

/* Kit Screen */
.kit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;
padding:60px 10px 10px}
.kit-card{background:var(--card-bg);border:2px solid var(--card-border);border-radius:12px;
padding:16px;text-align:center;cursor:pointer;transition:all 0.2s}
.kit-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.kit-card.selected{border-color:var(--gold);box-shadow:0 0 15px rgba(255,215,0,0.3)}
.kit-card.locked{opacity:0.5}
.kit-card .kit-emoji{font-size:40px;margin-bottom:4px}
.kit-card .kit-name{font-size:14px;font-weight:700}
.kit-card .kit-desc{font-size:11px;color:#888;margin-top:4px}
.kit-card .kit-req{font-size:10px;color:var(--accent);margin-top:6px}

/* Inventory */
.inv-tabs{display:flex;gap:4px;padding:55px 0 8px;flex-wrap:wrap}
.inv-tab{padding:6px 12px;border:1px solid var(--card-border);border-radius:6px;
background:transparent;color:var(--text);font-size:12px;cursor:pointer}
.inv-tab.active{background:var(--accent);border-color:var(--accent)}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}

/* Victory/Defeat */
.result-screen{text-align:center;padding-top:100px}
.result-screen h1{font-size:36px;margin-bottom:12px}
.result-screen .rewards{font-size:18px;margin:16px 0}

/* Toast */
.toast{position:fixed;top:50px;left:50%;transform:translateX(-50%);
background:var(--accent);color:#fff;padding:10px 24px;border-radius:8px;
font-weight:700;font-size:14px;z-index:300;animation:slideIn 0.3s ease;
pointer-events:none;white-space:nowrap}
.toast.gold{background:var(--gold);color:#000}
.toast.green{background:var(--green);color:#000}
.toast.red{background:var(--red)}

/* Damage numbers */
.dmg-number{position:fixed;font-size:24px;font-weight:900;z-index:250;
pointer-events:none;animation:floatUp 1s ease-out forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-60px)}}

/* Search bar */
.search-bar{margin:8px 0;position:relative}
.search-bar input{width:100%;padding:8px 12px 8px 32px;background:var(--bg3);
border:1px solid var(--card-border);border-radius:8px;color:var(--text);font-size:13px;outline:none}
.search-bar input:focus{border-color:var(--accent)}
.search-bar::before{content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:14px}

/* Stats bar on main menu */
.stats-bar{display:flex;justify-content:center;gap:20px;margin:16px 0;flex-wrap:wrap}
.stat-item{text-align:center}
.stat-item .stat-val{font-size:24px;font-weight:900;color:var(--gold)}
.stat-item .stat-label{font-size:11px;color:#888}

/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}

/* Responsive */
@media(max-width:480px){
.hud{font-size:11px;gap:4px;padding:6px 8px}
.menu-title{font-size:28px;padding-top:55px}
.era-grid{grid-template-columns:repeat(2,1fr);gap:8px}
.shelf-grid{grid-template-columns:repeat(3,1fr)}
.battle-choices{grid-template-columns:1fr}
.floating-card{width:75px;height:95px}
.floating-card .card-emoji{font-size:20px}
.floating-card .card-label{font-size:8px}
}
</style>
</head>
<body>

<!-- HUD -->
<div class="hud" id="hud">
<div class="hud-item"><span class="icon">⭐</span><span>Lv <span class="val" id="hud-level">1</span></span></div>
<div class="hud-item"><span class="icon">💰</span><span class="val" id="hud-gold">0</span></div>
<div class="hud-item"><span class="icon">🃏</span><span class="val" id="hud-cards">0</span></div>
<div class="xp-bar"><div class="xp-bar-fill" id="hud-xp-fill" style="width:0%"></div>
<div class="xp-bar-text" id="hud-xp-text">0 / 100 XP</div></div>
</div>

<!-- MAIN MENU -->
<div class="screen active" id="screen-menu">
<div class="menu-title">HISTORY CONQUEST</div>
<div class="menu-subtitle">Collect Knowledge. Crush Enemy Bases. Win the Bowl.</div>
<div class="stats-bar">
<div class="stat-item"><div class="stat-val" id="stat-topics">0</div><div class="stat-label">Topics</div></div>
<div class="stat-item"><div class="stat-val" id="stat-facts">0</div><div class="stat-label">Facts</div></div>
<div class="stat-item"><div class="stat-val" id="stat-battles">0</div><div class="stat-label">Battles Won</div></div>
<div class="stat-item"><div class="stat-val" id="stat-mastered">0</div><div class="stat-label">Mastered</div></div>
</div>
<div class="menu-buttons">
<button class="btn btn-gold" onclick="showScreen('screen-kits')">⚙️ KITS</button>
<button class="btn" onclick="showScreen('screen-inventory')">🎒 INVENTORY</button>
</div>
<div class="era-grid" id="era-grid"></div>
</div>

<!-- BASE SCREEN (per era) -->
<div class="screen" id="screen-base">
<div class="base-header">
<div class="era-icon" id="base-era-icon"></div>
<h2 id="base-era-name"></h2>
<div class="desc" id="base-era-desc"></div>
</div>
<div class="generator-area" id="generator-area">
<div class="generator-label">⚡ HINT GENERATOR ⚡ Click cards to collect knowledge!</div>
</div>
<div class="attack-btn-wrap">
<button class="btn btn-red" id="attack-btn" onclick="startBattle()">⚔️ ATTACK BASE</button>
</div>
<div class="card-shelf">
<h3>📚 Collected Topics <span id="shelf-count" style="color:#888;font-weight:400;font-size:12px"></span></h3>
<div class="search-bar"><input type="text" placeholder="Search topics..." id="shelf-search" oninput="filterShelf()"></div>
<div class="shelf-grid" id="shelf-grid"></div>
</div>
<button class="btn btn-back" onclick="showScreen('screen-menu')">← Back</button>
</div>

<!-- BATTLE SCREEN -->
<div class="screen" id="screen-battle">
<div class="battle-area">
<div class="hp-bars">
<div class="hp-bar-wrap hp-player"><div class="hp-bar-label"><span>🛡️ YOU</span><span id="player-hp-text">100</span></div>
<div class="hp-bar"><div class="hp-bar-fill" id="player-hp-fill" style="width:100%"></div></div></div>
<div class="hp-bar-wrap hp-enemy"><div class="hp-bar-label"><span>🏰 ENEMY BASE</span><span id="enemy-hp-text">100</span></div>
<div class="hp-bar"><div class="hp-bar-fill" id="enemy-hp-fill" style="width:100%"></div></div></div>
</div>
<div id="battle-round-info" style="text-align:center;font-size:12px;color:#888;margin-bottom:8px"></div>
<div class="battle-question" id="battle-question"></div>
<div id="battle-controls" style="text-align:center;margin-top:12px"></div>
</div>
<button class="btn btn-back" onclick="exitBattle()">← Retreat</button>
</div>

<!-- KIT SCREEN -->
<div class="screen" id="screen-kits">
<div style="padding-top:55px;text-align:center"><h2>⚙️ Select Your Kit</h2>
<p style="font-size:12px;color:#888;margin:4px 0">Master eras to unlock powerful kits!</p></div>
<div class="kit-grid" id="kit-grid"></div>
<button class="btn btn-back" onclick="showScreen('screen-menu')">← Back</button>
</div>

<!-- INVENTORY -->
<div class="screen" id="screen-inventory">
<div class="inv-tabs" id="inv-tabs"></div>
<div class="search-bar"><input type="text" placeholder="Search all cards..." id="inv-search" oninput="filterInventory()"></div>
<div class="inv-grid" id="inv-grid"></div>
<button class="btn btn-back" onclick="showScreen('screen-menu')">← Back</button>
</div>

<!-- CARD DETAIL MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
<div class="modal" id="modal-content"></div>
</div>

<script>

// ============= GAME STATE =============
let state = loadState();

function defaultState() {
return {
level: 1,
xp: 0,
gold: 0,
kit: 'soldier',
battlesWon: 0,
// collected[topicId] = [factIndex, ...] (which hints collected)
collected: {},
// mastered[topicId] = true (all 5 facts collected)
mastered: {},
// eraProgress[eraName] = {battlesWon, unlocked}
eraProgress: {},
// kitsUnlocked: ['soldier']
kitsUnlocked: ['soldier'],
};
}

function loadState() {
try {
const s = JSON.parse(localStorage.getItem('historyConquest'));
if (s && s.level) return s;
} catch(e) {}
return defaultState();
}

function saveState() {
localStorage.setItem('historyConquest', JSON.stringify(state));
}

function resetGame() {
if (confirm('Reset ALL progress? This cannot be undone!')) {
state = defaultState();
saveState();
location.reload();
}
}

// ============= XP / LEVEL SYSTEM =============
const XP_PER_LEVEL = 100;

function addXP(amount) {
state.xp += amount;
while (state.xp >= xpNeeded()) {
state.xp -= xpNeeded();
state.level++;
showToast('LEVEL UP! Lv ' + state.level, 'gold');
}
saveState();
updateHUD();
}

function xpNeeded() {
return XP_PER_LEVEL + (state.level - 1) * 20;
}

function addGold(amount) {
state.gold += amount;
saveState();
updateHUD();
}

// ============= HUD =============
function updateHUD() {
document.getElementById('hud-level').textContent = state.level;
document.getElementById('hud-gold').textContent = state.gold;
// Count collected facts
let totalFacts = 0;
for (const id in state.collected) totalFacts += state.collected[id].length;
document.getElementById('hud-cards').textContent = totalFacts;
const needed = xpNeeded();
const pct = Math.min(100, (state.xp / needed) * 100);
document.getElementById('hud-xp-fill').style.width = pct + '%';
document.getElementById('hud-xp-text').textContent = state.xp + ' / ' + needed + ' XP';
}

// ============= SCREEN MANAGEMENT =============
let currentScreen = 'screen-menu';
let currentEra = null;
let generatorInterval = null;

function showScreen(id, eraName) {
// Clean up generator
if (generatorInterval) { clearInterval(generatorInterval); generatorInterval = null; }

document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
document.getElementById(id).classList.add('active');
currentScreen = id;

if (id === 'screen-menu') renderMenu();
else if (id === 'screen-base' && eraName) { currentEra = eraName; renderBase(); }
else if (id === 'screen-kits') renderKits();
else if (id === 'screen-inventory') renderInventory();
updateHUD();
}

// ============= TOAST =============
function showToast(msg, type) {
const t = document.createElement('div');
t.className = 'toast ' + (type || '');
t.textContent = msg;
document.body.appendChild(t);
setTimeout(() => t.remove(), 1800);
}

// ============= DAMAGE NUMBER =============
function showDmgNumber(text, x, y, color) {
const d = document.createElement('div');
d.className = 'dmg-number';
d.style.left = x + 'px';
d.style.top = y + 'px';
d.style.color = color || '#ff1744';
d.textContent = text;
document.body.appendChild(d);
setTimeout(() => d.remove(), 1000);
}

// ============= MAIN MENU =============
function renderMenu() {
const grid = document.getElementById('era-grid');
grid.innerHTML = '';

// Stats
let topicsCollected = Object.keys(state.collected).length;
let totalFacts = 0;
for (const id in state.collected) totalFacts += state.collected[id].length;
let mastered = Object.keys(state.mastered).length;
document.getElementById('stat-topics').textContent = topicsCollected;
document.getElementById('stat-facts').textContent = totalFacts;
document.getElementById('stat-battles').textContent = state.battlesWon;
document.getElementById('stat-mastered').textContent = mastered;

for (const [eraName, meta] of Object.entries(ERA_META)) {
const eraTopics = ALL_TOPICS.filter(t => t.era === eraName);
const total = eraTopics.length * 5;
let collected = 0;
eraTopics.forEach(t => {
if (state.collected[t.id]) collected += state.collected[t.id].length;
});
const pct = total > 0 ? Math.round((collected / total) * 100) : 0;
const battlesWon = (state.eraProgress[eraName] || {}).battlesWon || 0;

const card = document.createElement('div');
card.className = 'era-card';
card.style.borderColor = meta.color + '66';
card.onclick = () => showScreen('screen-base', eraName);

let badge = '';
if (pct >= 100) badge = '<div class="era-badge" style="background:#00e676;color:#000">MASTER</div>';
else if (pct >= 60) badge = '<div class="era-badge" style="background:#aa00ff">EPIC</div>';
else if (pct >= 30) badge = '<div class="era-badge" style="background:#448aff">RARE</div>';

card.innerHTML = badge +
'<span class="era-emoji">' + meta.emoji + '</span>' +
'<div class="era-name">' + eraName + '</div>' +
'<div class="era-desc">' + meta.desc + '</div>' +
'<div class="era-progress"><div class="era-progress-fill" style="width:' + pct + '%;background:' + meta.color + '"></div></div>' +
'<div class="era-stats">' + collected + '/' + total + ' facts | ' + battlesWon + ' wins</div>';
grid.appendChild(card);
}
}

// ============= BASE SCREEN =============
let floatingCards = [];

function renderBase() {
const meta = ERA_META[currentEra];
document.getElementById('base-era-icon').textContent = meta.emoji;
document.getElementById('base-era-name').textContent = currentEra;
document.getElementById('base-era-desc').textContent = meta.desc;

// Update attack button
const eraTopics = ALL_TOPICS.filter(t => t.era === currentEra);
const total = eraTopics.length * 5;
let collected = 0;
eraTopics.forEach(t => {
if (state.collected[t.id]) collected += state.collected[t.id].length;
});
const pct = total > 0 ? (collected / total) * 100 : 0;
const btn = document.getElementById('attack-btn');
if (pct >= 15) {
btn.disabled = false;
btn.textContent = '⚔️ ATTACK BASE (' + Math.round(pct) + '% ready)';
btn.style.opacity = '1';
} else {
btn.disabled = true;
btn.textContent = '🔒 Collect 15% facts to attack (' + Math.round(pct) + '%)';
btn.style.opacity = '0.5';
}

renderShelf();
startGenerator();
}

function renderShelf() {
const grid = document.getElementById('shelf-grid');
grid.innerHTML = '';
const eraTopics = ALL_TOPICS.filter(t => t.era === currentEra);
const search = (document.getElementById('shelf-search').value || '').toLowerCase();

let shown = 0, totalInEra = eraTopics.length;
eraTopics.forEach(topic => {
if (search && !topic.name.toLowerCase().includes(search)) return;
const coll = state.collected[topic.id] || [];
const pct = (coll.length / 5) * 100;
const rarity = getRarity(coll.length);
const color = rarityColor(rarity);

const item = document.createElement('div');
item.className = 'shelf-item' + (coll.length >= 5 ? ' complete' : '');
item.onclick = () => showCardDetail(topic);
item.innerHTML =
'<div class="item-emoji">' + topic.icon + '</div>' +
'<div class="item-name" title="' + escHtml(topic.name) + '">' + escHtml(topic.name) + '</div>' +
'<div class="item-progress"><div class="item-progress-fill" style="width:' + pct + '%;background:' + color + '"></div></div>' +
'<div class="item-count" style="color:' + color + '">' + coll.length + '/5 ' + rarity.toUpperCase() + '</div>';
grid.appendChild(item);
shown++;
});
document.getElementById('shelf-count').textContent = '(' + shown + '/' + totalInEra + ')';
}

function filterShelf() { renderShelf(); }

function startGenerator() {
const area = document.getElementById('generator-area');
// Clear existing floating cards
floatingCards.forEach(fc => { if (fc.el && fc.el.parentNode) fc.el.remove(); });
floatingCards = [];

// Spawn initial cards
for (let i = 0; i < 3; i++) setTimeout(() => spawnCard(), i * 800);

// Keep spawning
generatorInterval = setInterval(() => {
if (floatingCards.length < 6) spawnCard();
}, 3500);
}

function spawnCard() {
const area = document.getElementById('generator-area');
if (!area || currentScreen !== 'screen-base') return;

const eraTopics = ALL_TOPICS.filter(t => t.era === currentEra);
if (eraTopics.length === 0) return;

// Prefer topics with uncollected facts
let candidates = eraTopics.filter(t => {
const coll = state.collected[t.id] || [];
return coll.length < 5;
});
if (candidates.length === 0) candidates = eraTopics;

const topic = candidates[Math.floor(Math.random() * candidates.length)];
const coll = state.collected[topic.id] || [];

// Pick a random uncollected fact, or any fact
let factIdx;
const uncollected = [0,1,2,3,4].filter(i => !coll.includes(i));
if (uncollected.length > 0) {
factIdx = uncollected[Math.floor(Math.random() * uncollected.length)];
} else {
factIdx = Math.floor(Math.random() * 5);
}

const rarity = getRarity(coll.length);
const rect = area.getBoundingClientRect();
const x = 10 + Math.random() * (rect.width - 110);
const y = 30 + Math.random() * (rect.height - 140);

const el = document.createElement('div');
el.className = 'floating-card ' + rarity;
el.style.left = x + 'px';
el.style.top = y + 'px';
el.style.animationDelay = (Math.random() * 2) + 's';
el.innerHTML =
'<div class="card-emoji">' + topic.icon + '</div>' +
'<div class="card-label">' + escHtml(topic.name) + '</div>' +
'<div class="card-rarity">' + rarity + '</div>';

const fcObj = { el, topic, factIdx };
el.onclick = (e) => collectCard(fcObj, e);
area.appendChild(el);
floatingCards.push(fcObj);

// Auto-remove after 8s
setTimeout(() => removeFloatingCard(fcObj), 8000);
}

function collectCard(fc, event) {
const topic = fc.topic;
const factIdx = fc.factIdx;

if (!state.collected[topic.id]) state.collected[topic.id] = [];

const alreadyHad = state.collected[topic.id].includes(factIdx);
if (!alreadyHad) {
state.collected[topic.id].push(factIdx);

// Check mastery
if (state.collected[topic.id].length >= 5) {
state.mastered[topic.id] = true;
showToast('⭐ MASTERED: ' + topic.name, 'gold');
addXP(25);
addGold(15);
} else {
showToast('+1 Fact: ' + topic.name, 'green');
addXP(5);
addGold(2);
}
} else {
showToast('Already known!', '');
addXP(1);
}

saveState();
removeFloatingCard(fc);
renderShelf();

// Update attack button
const eraTopics = ALL_TOPICS.filter(t => t.era === currentEra);
const total = eraTopics.length * 5;
let collected = 0;
eraTopics.forEach(t => {
if (state.collected[t.id]) collected += state.collected[t.id].length;
});
const pct = total > 0 ? (collected / total) * 100 : 0;
const btn = document.getElementById('attack-btn');
if (pct >= 15) {
btn.disabled = false;
btn.textContent = '⚔️ ATTACK BASE (' + Math.round(pct) + '% ready)';
btn.style.opacity = '1';
} else {
btn.textContent = '🔒 Collect 15% facts to attack (' + Math.round(pct) + '%)';
}
}

function removeFloatingCard(fc) {
if (fc.el && fc.el.parentNode) fc.el.remove();
floatingCards = floatingCards.filter(f => f !== fc);
}

// ============= CARD DETAIL MODAL =============
function showCardDetail(topic) {
const coll = state.collected[topic.id] || [];
const rarity = getRarity(coll.length);
const color = rarityColor(rarity);

let factsHtml = '<ul class="fact-list">';
for (let i = 0; i < 5; i++) {
const known = coll.includes(i);
factsHtml += '<li data-num="' + (i+1) + '" class="' + (known ? '' : 'locked') + '">' +
(known ? escHtml(topic.facts[i]) : '??? Collect more cards to reveal ???') + '</li>';
}
factsHtml += '</ul>';

let funFactHtml = '';
if (coll.length >= 5) {
funFactHtml = '<div class="fun-fact">🌟 ' + escHtml(topic.funFact) + '</div>';
} else {
funFactHtml = '<div class="fun-fact" style="opacity:0.3">🔒 Collect all 5 facts to reveal fun fact</div>';
}

const modal = document.getElementById('modal-content');
modal.innerHTML =
'<button class="modal-close" onclick="closeModal()">&times;</button>' +
'<h2><span style="color:' + color + '">' + topic.icon + '</span> ' + escHtml(topic.name) + '</h2>' +
'<div class="modal-era">' + topic.era + ' | <span style="color:' + color + '">' + rarity.toUpperCase() + '</span> | ' + coll.length + '/5 facts</div>' +
factsHtml + funFactHtml;

document.getElementById('modal-overlay').classList.add('active');
}

function closeModal() {
document.getElementById('modal-overlay').classList.remove('active');
}

// ============= BATTLE SYSTEM =============
let battleState = null;

function startBattle() {
const eraTopics = ALL_TOPICS.filter(t => t.era === currentEra);
// Pick topics that have at least 1 fact collected
let battleTopics = eraTopics.filter(t => (state.collected[t.id] || []).length > 0);
if (battleTopics.length < 5) battleTopics = eraTopics;

// Shuffle and pick up to 10 questions
const shuffled = battleTopics.sort(() => Math.random() - 0.5).slice(0, 10);

// Kit bonuses
const kit = KITS.find(k => k.id === state.kit) || KITS[0];

battleState = {
questions: shuffled,
currentQ: 0,
playerHP: 100 + (kit.defBonus || 0),
playerMaxHP: 100 + (kit.defBonus || 0),
enemyHP: 100,
enemyMaxHP: 100,
atkBonus: kit.atkBonus || 0,
hintBonus: kit.hintBonus || 0,
rewards: { xp: 0, gold: 0 },
};

showScreen('screen-battle');
renderBattleQuestion();
}

function renderBattleQuestion() {
if (!battleState) return;

// Check win/lose
if (battleState.enemyHP <= 0) return battleVictory();
if (battleState.playerHP <= 0) return battleDefeat();
if (battleState.currentQ >= battleState.questions.length) {
if (battleState.enemyHP < battleState.enemyMaxHP) return battleVictory();
return battleDefeat();
}

// Update HP bars
updateHPBars();

const topic = battleState.questions[battleState.currentQ];
const coll = state.collected[topic.id] || [];

document.getElementById('battle-round-info').textContent =
'Round ' + (battleState.currentQ + 1) + '/' + battleState.questions.length;

// Show hints (collected ones + bonus from kit)
let hintsToShow = Math.min(2 + battleState.hintBonus, 5);
let hintHtml = '<div class="battle-hints">';
for (let i = 0; i < Math.min(hintsToShow, 5); i++) {
const known = coll.includes(i);
if (known || i < 1 + battleState.hintBonus) {
hintHtml += '<div class="battle-hint ' + (known ? 'known' : '') + '">' +
(known ? '✅ ' : '💡 ') + escHtml(topic.facts[i]) + '</div>';
} else {
hintHtml += '<div class="battle-hint unknown">??? Hidden hint ???</div>';
}
}
hintHtml += '</div>';

// Build choices
const correct = topic.name;
let choices = [correct, ...topic.wrong].sort(() => Math.random() - 0.5);

let choicesHtml = '<div class="battle-choices">';
choices.forEach(c => {
choicesHtml += '<div class="battle-choice" data-choice="' + escHtml(c) + '" data-correct="' + escHtml(correct) + '">' + escHtml(c) + '</div>';
});
choicesHtml += '</div>';

document.getElementById('battle-question').innerHTML = hintHtml + choicesHtml;
// Event delegation for battle choices
document.querySelectorAll('.battle-choice').forEach(function(el) {
el.addEventListener('click', function() {
answerBattle(this, this.getAttribute('data-choice'), this.getAttribute('data-correct'));
});
});
document.getElementById('battle-controls').innerHTML = '';
}

function answerBattle(el, chosen, correct) {
// Disable all choices
document.querySelectorAll('.battle-choice').forEach(c => c.classList.add('disabled'));

const isCorrect = chosen.toLowerCase() === correct.toLowerCase();

if (isCorrect) {
el.classList.add('correct');
const dmg = 15 + battleState.atkBonus + Math.floor(Math.random() * 10);
battleState.enemyHP = Math.max(0, battleState.enemyHP - dmg);
battleState.rewards.xp += 10;
battleState.rewards.gold += 5;
showToast('✅ Correct! -' + dmg + ' HP', 'green');

// Collect any uncollected fact from this topic as bonus
const topic = battleState.questions[battleState.currentQ];
const coll = state.collected[topic.id] || [];
const uncollected = [0,1,2,3,4].filter(i => !coll.includes(i));
if (uncollected.length > 0) {
const bonus = uncollected[0];
if (!state.collected[topic.id]) state.collected[topic.id] = [];
state.collected[topic.id].push(bonus);
if (state.collected[topic.id].length >= 5) state.mastered[topic.id] = true;
saveState();
}
} else {
el.classList.add('wrong');
// Highlight correct
document.querySelectorAll('.battle-choice').forEach(c => {
if (c.textContent === correct) c.classList.add('correct');
});
const dmg = 10 + Math.floor(Math.random() * 10);
battleState.playerHP = Math.max(0, battleState.playerHP - dmg);
showToast('❌ Wrong! -' + dmg + ' HP', 'red');
}

updateHPBars();

setTimeout(() => {
battleState.currentQ++;
renderBattleQuestion();
}, 1500);
}

function updateHPBars() {
if (!battleState) return;
const pp = (battleState.playerHP / battleState.playerMaxHP) * 100;
const ep = (battleState.enemyHP / battleState.enemyMaxHP) * 100;
document.getElementById('player-hp-fill').style.width = pp + '%';
document.getElementById('player-hp-text').textContent = battleState.playerHP;
document.getElementById('enemy-hp-fill').style.width = ep + '%';
document.getElementById('enemy-hp-text').textContent = battleState.enemyHP;
}

function battleVictory() {
state.battlesWon++;
if (!state.eraProgress[currentEra]) state.eraProgress[currentEra] = {};
state.eraProgress[currentEra].battlesWon = (state.eraProgress[currentEra].battlesWon || 0) + 1;

const bonusGold = 20 + state.level * 5;
const bonusXP = 30 + state.level * 5;
battleState.rewards.gold += bonusGold;
battleState.rewards.xp += bonusXP;

addGold(battleState.rewards.gold);
addXP(battleState.rewards.xp);
saveState();

document.getElementById('battle-question').innerHTML =
'<div class="battle-result" style="color:var(--green)">' +
'🏆 VICTORY! Enemy Base Destroyed!' +
'<div style="font-size:14px;margin-top:8px;color:var(--gold)">' +
'+' + battleState.rewards.gold + ' Gold | +' + battleState.rewards.xp + ' XP</div></div>';
document.getElementById('battle-controls').innerHTML =
'<button class="btn btn-green" id="btn-continue" style="margin:4px">Continue</button>' +
'<button class="btn btn-red" id="btn-battle-again" style="margin:4px">Battle Again</button>';
document.getElementById('btn-continue').addEventListener('click', function() { showScreen('screen-base', currentEra); });
document.getElementById('btn-battle-again').addEventListener('click', function() { startBattle(); });

checkKitUnlocks();
}

function battleDefeat() {
document.getElementById('battle-question').innerHTML =
'<div class="battle-result" style="color:var(--red)">' +
'💀 DEFEATED! Your base was destroyed.' +
'<div style="font-size:14px;margin-top:8px;color:#888">' +
'Collect more facts and try again!</div></div>';
document.getElementById('battle-controls').innerHTML =
'<button class="btn" id="btn-back-base" style="margin:4px">Back to Base</button>' +
'<button class="btn btn-red" id="btn-try-again" style="margin:4px">Try Again</button>';
document.getElementById('btn-back-base').addEventListener('click', function() { showScreen('screen-base', currentEra); });
document.getElementById('btn-try-again').addEventListener('click', function() { startBattle(); });
}

function exitBattle() {
battleState = null;
showScreen('screen-base', currentEra);
}

// ============= KIT SYSTEM =============
const KITS = [
{ id: 'soldier', name: 'Soldier', emoji: '🪖', desc: 'Default kit. Balanced stats.',
  atkBonus: 0, defBonus: 0, hintBonus: 0, req: null, reqText: 'Default' },
{ id: 'scholar', name: 'Scholar', emoji: '📖', desc: '+1 bonus hint in battle.',
  atkBonus: 0, defBonus: 0, hintBonus: 1, req: () => Object.keys(state.mastered).length >= 10,
  reqText: 'Master 10 topics' },
{ id: 'napoleon', name: 'Napoleon', emoji: '🎖️', desc: '+10 attack damage.',
  atkBonus: 10, defBonus: 0, hintBonus: 0, req: () => state.battlesWon >= 5,
  reqText: 'Win 5 battles' },
{ id: 'lincoln', name: 'Lincoln', emoji: '🎩', desc: '+30 max HP.',
  atkBonus: 0, defBonus: 30, hintBonus: 0, req: () => state.battlesWon >= 10,
  reqText: 'Win 10 battles' },
{ id: 'cleopatra', name: 'Cleopatra', emoji: '👑', desc: '+5 ATK, +15 HP, +1 hint.',
  atkBonus: 5, defBonus: 15, hintBonus: 1, req: () => Object.keys(state.mastered).length >= 30,
  reqText: 'Master 30 topics' },
{ id: 'alexander', name: 'Alexander', emoji: '⚡', desc: '+15 ATK, +2 hints. Ultimate kit.',
  atkBonus: 15, defBonus: 0, hintBonus: 2, req: () => Object.keys(state.mastered).length >= 80,
  reqText: 'Master 80 topics' },
];

function checkKitUnlocks() {
KITS.forEach(kit => {
if (kit.req && kit.req() && !state.kitsUnlocked.includes(kit.id)) {
state.kitsUnlocked.push(kit.id);
showToast('🔓 Kit Unlocked: ' + kit.name, 'gold');
saveState();
}
});
}

function renderKits() {
const grid = document.getElementById('kit-grid');
grid.innerHTML = '';
KITS.forEach(kit => {
const unlocked = state.kitsUnlocked.includes(kit.id);
const selected = state.kit === kit.id;
const card = document.createElement('div');
card.className = 'kit-card' + (selected ? ' selected' : '') + (!unlocked ? ' locked' : '');
card.onclick = () => {
if (unlocked) { state.kit = kit.id; saveState(); renderKits(); showToast('Kit: ' + kit.name, ''); }
else showToast('🔒 ' + kit.reqText, 'red');
};
card.innerHTML =
'<div class="kit-emoji">' + kit.emoji + '</div>' +
'<div class="kit-name">' + kit.name + (selected ? ' ✓' : '') + '</div>' +
'<div class="kit-desc">' + kit.desc + '</div>' +
'<div class="kit-req">' + (unlocked ? '✅ Unlocked' : '🔒 ' + kit.reqText) + '</div>';
grid.appendChild(card);
});
}

// ============= INVENTORY =============
let invEra = 'all';

function renderInventory() {
const tabs = document.getElementById('inv-tabs');
tabs.innerHTML = '';
const allTab = document.createElement('button');
allTab.className = 'inv-tab' + (invEra === 'all' ? ' active' : '');
allTab.textContent = 'All';
allTab.onclick = () => { invEra = 'all'; renderInventory(); };
tabs.appendChild(allTab);

for (const eraName of Object.keys(ERA_META)) {
const tab = document.createElement('button');
tab.className = 'inv-tab' + (invEra === eraName ? ' active' : '');
tab.textContent = ERA_META[eraName].emoji + ' ' + eraName.split(' ')[0];
tab.onclick = () => { invEra = eraName; renderInventory(); };
tabs.appendChild(tab);
}

filterInventory();
}

function filterInventory() {
const grid = document.getElementById('inv-grid');
grid.innerHTML = '';
const search = (document.getElementById('inv-search').value || '').toLowerCase();

let topics = ALL_TOPICS;
if (invEra !== 'all') topics = topics.filter(t => t.era === invEra);
if (search) topics = topics.filter(t => t.name.toLowerCase().includes(search));

// Sort: collected first, then by name
topics.sort((a, b) => {
const ac = (state.collected[a.id] || []).length;
const bc = (state.collected[b.id] || []).length;
if (bc !== ac) return bc - ac;
return a.name.localeCompare(b.name);
});

topics.forEach(topic => {
const coll = state.collected[topic.id] || [];
if (coll.length === 0 && search === '') return; // Hide uncollected unless searching
const rarity = getRarity(coll.length);
const color = rarityColor(rarity);

const item = document.createElement('div');
item.className = 'shelf-item' + (coll.length >= 5 ? ' complete' : '');
item.onclick = () => showCardDetail(topic);
item.innerHTML =
'<div class="item-emoji">' + topic.icon + '</div>' +
'<div class="item-name" title="' + escHtml(topic.name) + '">' + escHtml(topic.name) + '</div>' +
'<div class="item-progress"><div class="item-progress-fill" style="width:' + (coll.length/5*100) + '%;background:' + color + '"></div></div>' +
'<div class="item-count" style="color:' + color + '">' + coll.length + '/5</div>';
grid.appendChild(item);
});

if (grid.children.length === 0) {
grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#555;padding:40px">No cards collected yet! Visit an era base to start collecting.</div>';
}
}

// ============= UTILITIES =============
function getRarity(count) {
if (count >= 5) return 'legendary';
if (count >= 3) return 'epic';
if (count >= 1) return 'rare';
return 'common';
}

function rarityColor(r) {
return { common: '#888', rare: '#448aff', epic: '#aa00ff', legendary: '#ffd700' }[r] || '#888';
}

function escHtml(s) {
return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escAttr(s) {
return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"');
}

// ============= INIT =============
checkKitUnlocks();
showScreen('screen-menu');

</script>
